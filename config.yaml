# ─── Application ─────────────────────────────────────────────────────────────
app:
  name: SentinelLM
  version: "1.0"
  config_version: "1"        # increment when evaluator config changes
                              # (used to invalidate Redis cache keys)
  log_level: INFO             # DEBUG | INFO | WARNING | ERROR
  shadow_mode: false          # if true: log scores but never block requests
                              # useful for threshold tuning before going live
  wrap_untrusted_input: true  # wrap user messages in <untrusted_user_input> tags
                              # and add a system instruction not to treat their
                              # content as directives, before forwarding to the
                              # LLM. Evaluators still score the original,
                              # unwrapped text — this only hardens the outbound
                              # prompt. Content-modifying like PII redaction, so
                              # default true; set false to send messages verbatim.

# ─── LLM Backend ─────────────────────────────────────────────────────────────
# Choose one provider. Switch by changing `provider` — no code changes needed.
# API keys for cloud providers are set via environment variables (never in config.yaml).

llm_backend:
  provider: anthropic           # ollama | openai | anthropic | gemini

  ollama:
    base_url: http://ollama:11434   # internal Docker network URL
    model: llama3.2                 # model name served by Ollama
    timeout_seconds: 60

  openai:
    model: gpt-4o                   # any OpenAI chat model
    timeout_seconds: 60
    # API key: set OPENAI_API_KEY in .env

  anthropic:
    model: claude-sonnet-4-6        # any Anthropic model ID
    timeout_seconds: 60
    # API key: set ANTHROPIC_API_KEY in .env

  gemini:
    model: gemini-2.5-flash    # gemini-2.0-flash | gemini-2.0-flash-lite | gemini-2.5-flash-lite
    timeout_seconds: 60
    # API key: set GEMINI_API_KEY in .env

# ─── Evaluator Chain ─────────────────────────────────────────────────────────
# Each evaluator has: enabled, threshold, and optionally evaluator-specific fields.
# threshold: score above which a flag is raised (and request blocked for input evaluators)
# Set enabled: false to skip an evaluator entirely (no latency cost).

evaluators:

  # Input evaluators (run BEFORE the LLM call)

  pii:
    enabled: true
    threshold: 0.5              # Presidio returns binary per-entity; threshold = min
                                # confidence score to consider a PII detection valid
    action: redact              # redact | block
                                # redact: remove PII and pass request through
                                # block: reject the request with 400
    spacy_model: en_core_web_lg # en_core_web_sm | en_core_web_md | en_core_web_lg
                                # Must match a model installed in the runtime image —
                                # docker/Dockerfile.api installs en_core_web_lg (700 MB).
                                # Measured directly: en_core_web_sm's smaller NER model
                                # misreads ordinary capitalized words as PERSON (e.g.
                                # "Nimbus" as a product name, "Untrusted" as a section
                                # label) — en_core_web_lg cleanly fixes both while still
                                # catching real names. Switch back to _sm (12 MB) only
                                # if the smaller image size matters more than that.

  prompt_injection:
    enabled: true
    threshold: 0.80             # injection probability above which request is blocked
    model: "deepset/deberta-v3-base-injection"  # HuggingFace model ID
    device: auto                # auto | cpu | mps
                                # auto: use MPS if available, else CPU

  topic_guardrail:
    enabled: false              # disabled by default; requires allowed_topics to be set
    threshold: 0.30             # minimum cosine similarity to allowed topics
                                # requests BELOW threshold are blocked (off-topic)
    allowed_topics:             # define the domain your app covers
      - "software engineering"
      - "programming"
      - "computer science"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  # Output evaluators (run AFTER the LLM response arrives)

  toxicity:
    enabled: true
    threshold: 0.70             # Detoxify score above which output is flagged
    dimensions:                 # which Detoxify dimensions to check
      - toxicity
      - severe_toxicity
      - threat
      - insult
      - identity_attack
      # - obscenity           # uncomment to enable
    flag_on: any                # any | all
                                # any: flag if ANY dimension exceeds threshold
                                # all: flag only if ALL dimensions exceed threshold

  exfiltration:
    enabled: true
    threshold: 0.5               # effectively binary — any match scores 1.0
    action: strip                # strip | flag
                                # strip: remove the image markdown and swap the
                                #   cleaned text into the response (default)
                                # flag: score and log only, response unchanged —
                                #   use to observe before enabling stripping
    allowed_domains: []          # hostnames exempt from stripping, e.g. your
                                # own CDN — image URLs elsewhere are stripped

  relevance:
    enabled: true
    threshold: 0.30             # cosine similarity BELOW which output is flagged
                                # (low relevance = off-topic response)
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  hallucination:
    enabled: true
    threshold: 0.50             # score above which output is flagged (see backend below)
    backend: consistency        # consistency | nli — benchmarked against HaluEval:
                                # consistency = AUC 0.78, ~77% accuracy (this default)
                                # nli         = AUC 0.59, ~59% accuracy (previous default)
                                # See README § Evaluator Accuracy for the full comparison.
    model: "vectara/hallucination_evaluation_model"
                                # Purpose-built factual-consistency model. Loaded with
                                # trust_remote_code=True (runs vendor code from HuggingFace,
                                # not just weights) — set backend: nli below if that's not
                                # acceptable in your environment (weaker measured accuracy,
                                # no remote code execution; also uncomment nli-only settings).
    # device: auto                # nli backend only. ignored when use_onnx: true
    # use_onnx: false             # nli backend only. ~3-5x faster inference (requires onnxruntime + optimum)
    # Only runs when context_documents are present in the request.
    # Silently skipped (score = null) if no context provided.

  faithfulness:
    enabled: true
    threshold: 0.50             # score below which output is flagged (see backend below)
    backend: consistency        # consistency | nli — same model/tradeoffs as hallucination above
    model: "vectara/hallucination_evaluation_model"
    # device: auto                # nli backend only
    # use_onnx: false             # nli backend only
    # Only runs when context_documents are present in the request.

# ─── Caching ─────────────────────────────────────────────────────────────────
cache:
  enabled: true
  ttl_seconds: 3600             # 1 hour TTL for cached input evaluator scores
  # Redis connection is configured via REDIS_URL environment variable

# ─── Rate Limiting ────────────────────────────────────────────────────────────
# Fixed-window counter (Redis) guarding /v1/chat/completions — the one route
# that forwards to a metered LLM backend. Keyed by X-API-Key when auth is
# configured, otherwise by client IP.
rate_limit:
  enabled: true
  requests_per_minute: 60

# ─── Evaluator Performance ───────────────────────────────────────────────────
performance:
  thread_pool_workers: 4        # threads for CPU-bound model inference
                                # recommended: number of performance cores on your Mac
  evaluator_timeout_seconds: 3  # per-evaluator timeout; exceed = fail-open

# ─── Storage ─────────────────────────────────────────────────────────────────
storage:
  store_input_text: true        # if false: never store raw input_text (only hash)
                                # auto-set to false for requests where PII is detected
  store_output_text: false      # storing output can be expensive at volume; off by default

# ─── Dashboard / WebSocket ───────────────────────────────────────────────────
websocket:
  max_connections: 10           # max simultaneous dashboard WebSocket clients

# ─── Observability ────────────────────────────────────────────────────────────
# Tracing: opt-in via OTEL_EXPORTER_OTLP_ENDPOINT (env var, not here) — works
# with any OTLP-compatible backend (Honeycomb, Grafana Cloud, self-hosted
# Jaeger, ...). Metrics: see /metrics (Prometheus). Alerting below.
observability:
  alerting:
    enabled: true
    check_interval_seconds: 60
    # Webhook URL comes from SENTINEL_ALERT_WEBHOOK_URL (env var, not here) —
    # a Slack incoming webhook or any endpoint that accepts {"text": "..."}.
    # Alerting still runs with no URL set; it just logs instead of POSTing.
    thresholds:
      error_rate: 0.10              # LLM backend call error rate
      block_rate: 0.50              # fraction of requests blocked by input guardrails
      evaluator_failure_rate: 0.10  # fraction of evaluator calls that errored/timed out
      p95_latency_ms: 10000
